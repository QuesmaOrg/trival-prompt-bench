# trivial-prompt-bench configuration: the test suite (models) and cost assumptions.

[bench]
# Runs per model (Harbor's -k / --n-attempts). More runs -> better latency averages.
attempts = 5
# Concurrent trials (Harbor's -n). Keep modest to avoid provider rate limits.
concurrency = 4
# Tasks `make bench` runs by default (dir names under tasks/). The other tasks stay
# in the repo and can be run on demand: `python -m trivial_prompt_bench.run --task tasks/<name>`.
# Set to an empty list [] to run every task under tasks/.
tasks = ["hi", "thank-you", "wtf", "commit"]

# The "test suite": the models to benchmark. LiteLLM identifiers routed through
# OpenRouter (the `openrouter/` prefix uses OPENROUTER_API_KEY from .env).
[models]
list = [
    # Anthropic
    "openrouter/anthropic/claude-haiku-4.5",
    "openrouter/anthropic/claude-sonnet-5",
    "openrouter/anthropic/claude-opus-4.8",
    "openrouter/anthropic/claude-fable-5",
    # OpenAI
    "openrouter/openai/gpt-5.5",
    "openrouter/openai/gpt-5.4-mini",
    # Google
    "openrouter/google/gemini-3.1-pro-preview",
    "openrouter/google/gemini-3.5-flash",
    # xAI
    "openrouter/x-ai/grok-4.3",
    # Chinese labs
    "openrouter/deepseek/deepseek-v4-pro",
    "openrouter/qwen/qwen3.7-max",
    "openrouter/moonshotai/kimi-k2.6",
    "openrouter/z-ai/glm-5.2",
    "openrouter/minimax/minimax-m3",
]

# Models used by `make smoke` — offline, no API keys, no network.
mock_list = [
    "mock/fast-cheap",
    "mock/slow-pricey",
]

[analysis]
# Model used to generate the short per-task failure analysis (see `make analyze`).
# A LiteLLM identifier; needs the matching API key in .env.
model = "openrouter/anthropic/claude-haiku-4.5"

[cost]
# "User waiting cost" prices the developer's time spent waiting for the answer.
# per_second = annual_salary_usd / (work_hours_per_year * 3600)
#
# Default: ~US average software developer total comp. Adjust to taste; the raw
# per-run data in sqlite is assumption-free, so only the report changes.
annual_salary_usd = 120000
work_hours_per_year = 2080   # 40 h/week * 52 weeks
