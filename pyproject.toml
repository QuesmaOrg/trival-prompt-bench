[project]
name = "hi-bench"
version = "0.1.0"
description = "A tiny LLM cost/latency benchmark built on the Harbor framework."
requires-python = ">=3.12,<3.14"
dependencies = [
    "harbor",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hi_bench"]
